# Tarea puntual (se lanza a mano): descarga texturas planetarias de 2K de Solar System Scope (CC BY 4.0)
# para el modo Objeto y las guarda en img/planets/2k/.
name: Descargar texturas 2K
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  texturas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar
        run: |
          mkdir -p img/planets/2k
          for f in 2k_earth_daymap 2k_earth_clouds 2k_mercury 2k_venus_surface 2k_venus_atmosphere 2k_jupiter 2k_saturn 2k_uranus 2k_neptune; do
            curl -sfL --max-time 120 -o "img/planets/2k/$f.jpg" "https://www.solarsystemscope.com/textures/download/$f.jpg" && echo "✔ $f" || echo "✘ $f"
          done
          curl -sfL --max-time 120 -o "img/planets/2k/2k_saturn_ring_alpha.png" "https://www.solarsystemscope.com/textures/download/2k_saturn_ring_alpha.png" && echo "✔ anillos" || echo "✘ anillos"
          ls -la img/planets/2k
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/planets/2k
          git diff --cached --quiet || (git commit -m "Texturas planetarias 2K (Solar System Scope, CC BY 4.0)" && git push)
