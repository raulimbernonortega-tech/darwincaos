# Actualiza el calendario del planetario (vídeos del canal, lanzamientos y eventos manuales) cada 6 horas.
# También se puede lanzar a mano: pestaña Actions → «Actualizar calendario» → Run workflow.
name: Actualizar calendario

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - data/eventos-manuales.json
      - data/videos-asignados.json

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar la librería de miniaturas
        run: npm install --no-save --no-package-lock sharp@0.33.5
      - name: Descargar vídeos, lanzamientos y eventos
        run: node scripts/actualizar-calendario.mjs
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/eventos.json data/miniaturas data/videos-info.json
          git diff --cached --quiet || (git commit -m "Calendario: actualización automática" && git push)
